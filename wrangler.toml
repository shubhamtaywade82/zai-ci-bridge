name = "zai-ci-bridge"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
# Comma-separated owner/repository names, or "*" to discover all repositories accessible by GITHUB_TOKEN.
ALLOWED_REPOS="*"
NON_DEFAULT_PR_TARGET_MODE="original_base"
MAX_BOT_COMMITS_PER_BRANCH="5"
MAX_DIAGNOSTIC_TARGETS="50"

[limits]
subrequests = 1000
